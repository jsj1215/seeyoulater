<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Floppy disk body -->
  <rect x="2" y="2" width="28" height="28" rx="2" fill="#1a6b5a"/>
  <!-- 3D highlight top -->
  <rect x="2" y="2" width="28" height="2" rx="1" fill="#2a8f78" opacity="0.8"/>
  <!-- 3D highlight left -->
  <rect x="2" y="2" width="2" height="28" rx="1" fill="#2a8f78" opacity="0.5"/>
  <!-- 3D shadow right -->
  <rect x="28" y="4" width="2" height="26" rx="1" fill="#0f4f3e" opacity="0.8"/>
  <!-- 3D shadow bottom -->
  <rect x="4" y="28" width="26" height="2" rx="1" fill="#0f4f3e" opacity="0.8"/>

  <!-- Label area -->
  <rect x="5" y="4" width="19" height="12" rx="1" fill="#f2ede3"/>
  <!-- Label lines -->
  <rect x="7" y="7"  width="12" height="1.5" rx="0.5" fill="#8c7a5c" opacity="0.5"/>
  <rect x="7" y="10" width="9"  height="1.5" rx="0.5" fill="#8c7a5c" opacity="0.5"/>
  <rect x="7" y="13" width="11" height="1.5" rx="0.5" fill="#8c7a5c" opacity="0.5"/>

  <!-- Write-protect tab -->
  <rect x="25" y="4" width="4" height="5" rx="1" fill="#0f4f3e"/>
  <rect x="26" y="5" width="2" height="3" rx="0.5" fill="#1a6b5a"/>

  <!-- Metal shutter -->
  <rect x="5" y="17" width="22" height="11" rx="1" fill="#c4b49a"/>
  <!-- Shutter highlight -->
  <rect x="5" y="17" width="22" height="1" fill="#d4c8b4" opacity="0.8"/>
  <!-- Shutter slot -->
  <rect x="10" y="19" width="12" height="7" rx="1" fill="#8c7a5c" opacity="0.4"/>
  <!-- Shutter slot inner -->
  <rect x="11" y="20" width="10" height="5" rx="0.5" fill="#6b5540" opacity="0.3"/>
</svg>
