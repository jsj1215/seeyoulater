spring:
  # 로컬 .env(gitignore 대상)를 프로퍼티로 읽어 ${JWT_SECRET} 등을 주입
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seeyoulater}
    username: ${DB_USERNAME:seeyoulater}
    password: ${DB_PASSWORD:seeyoulater}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

app:
  max-users: 1000
  cookie:
    # 운영(HTTPS)은 true 유지. Safari로 http://localhost 개발 시에만 COOKIE_SECURE=false
    secure: ${COOKIE_SECURE:true}
  cors:
    # 콤마로 여러 개 지정 가능. 예) https://seeyoulater.example.com,http://localhost:5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    login-per-minute: 10
    signup-per-minute: 5
    og-per-minute: 30

server:
  port: 8080
